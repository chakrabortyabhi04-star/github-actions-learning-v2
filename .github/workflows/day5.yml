name: Day 5 workflow
env:
  APP_NAME: my-app
  VERSION: 1.0.0
on:
  schedule:
    # Runs every day at 9:00 AM UTC
    - cron: '0 9 * * *'
  pull_request:
  push:
    branches:
      - main  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production    
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Printing the message
        run: echo "validate successful"
      - name: Printing variable
        run:  echo "$APP_NAME $VERSION "
      - name: Print context info
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"  

  security:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Printing the message
        run: echo "security successful"
      - name: Printing variable
        run:  echo "$APP_NAME $VERSION "

  build:
    needs: security  
    runs-on: ubuntu-latest
    steps:
      - name: Printing the message
        run: echo "build successful"
      - name: Printing variable
        run:  echo "$APP_NAME $VERSION "  

         